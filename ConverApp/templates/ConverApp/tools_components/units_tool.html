<section id="units-converter" class="page" style="display: none;">
    <!-- Titre de l'outil avec le liseré vert ConverHub -->
    <div style="margin-bottom: 24px;">
        <h2 style="font-size: 1.5rem; font-weight: 800; border-left: 4px solid var(--ch-accent); padding-left: 12px; margin: 0;">
            Conversion d'unité
        </h2>
        <p style="font-size: 0.85rem; color: var(--ch-muted); margin: 4px 0 0 16px;">
            Convertissez instantanément vos mesures : m, cm, mm et plus.
        </p>
    </div>

    <div class="result-container">
        <h1 id="result-meta" class="result-text"></h1>
    </div>

    <!-- Formulaire de saisie vertical épuré -->
    <div style="display: flex; flex-direction: column; gap: 12px;">

        <!-- Ligne d'Entrée : DE -->
        <div style="display: flex; flex-direction: column; gap: 6px;">
            <span class="ch-label">DE</span>
            <div style="display: flex; gap: 10px; align-items: center;">
                <select id="unit-first" placeholder="Choisissez l'unité source..."
                        style="width: 120px;"></select>
                <input type="number" id="unit-input" class="ch-input" style="flex: 1;" placeholder="1">
            </div>
        </div>

        <!-- Séparateur horizontal-->
        <div class="ch-divider">
            <button id="switchUnitBtn" class="ch-btn-swap"><i
                    class="fa-solid fa-arrow-right-arrow-left"></i></button>
        </div>

        <!-- Ligne de Sortie-->
        <div style="display: flex; flex-direction: column; gap: 6px;">
            <span class="ch-label">VERS</span>
            <div style="display: flex; gap: 10px; align-items: center;">
                <select id="unit-second" style="width: 120px;"
                        placeholder="Choisissez l'unité cible..."></select>

                <input type="text" id="unit-result-input" class="ch-result-field" disabled
                       placeholder="">
            </div>
        </div>

    </div>

</section>
