{% load static %}
<header class="ch-navbar-pill ch-animate-in">

    <!-- 1. Logo à gauche -->
    <div style="display: flex; align-items: center; gap: 8px;">
        <a href="{% url 'home' %}" style="display: flex; align-items: center; gap: 8px;">
            <img src="{% static 'ConverApp/Brand images/logo-dark.png' %}" alt="ConverHub Logo" style="height: 32px; width: auto;">
        </a>
    </div>

    <!-- 2. Liens centraux (Outils & À propos) — Masqués sur mobile pour garder la pilule compacte -->
    <nav class="ch-header-links" style="display: flex; align-items: center; gap: 28px;">
        <a href="#tools-section" style="font-size: 0.88rem; font-weight: 600; color: var(--ch-muted); transition: color 0.15s ease;">Outils</a>
        <a href="#why-section" style="font-size: 0.88rem; font-weight: 600; color: var(--ch-muted); transition: color 0.15s ease;">À propos</a>
    </nav>

    <!-- 3. Bouton d'action à droite -->
    <div>
        <a href="{% url 'tools' 'currency-converter' %}" class="ch-btn ch-btn-primary" style="padding: 8px 18px; font-size: 0.82rem;">
            Explorer les outils <i class="fa-solid fa-arrow-right" style="font-size: 0.75rem; margin-left: 4px;"></i>
        </a>
    </div>

</header>
